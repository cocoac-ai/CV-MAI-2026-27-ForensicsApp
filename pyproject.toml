[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forensics-app"
version = "0.1.0"
description = "Extensible Tkinter starter for an MSc Computer Vision course"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.24",
    "Pillow>=10.0,<13",
]

[tool.setuptools.packages.find]
include = ["forensics_app*"]
